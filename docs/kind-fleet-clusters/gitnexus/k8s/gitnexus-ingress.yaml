apiVersion: v1
kind: Service
metadata:
  name: gitnexus
  namespace: infra
  labels:
    app.kubernetes.io/name: gitnexus
    am.io/bridge: host-serve
spec:
  ports:
    - name: http
      port: 4747
      targetPort: 4747
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: gitnexus
  namespace: infra
  labels:
    app.kubernetes.io/name: gitnexus
    am.io/bridge: host-serve
subsets:
  - addresses:
      # Kind docker bridge gateway on Contabo nonprod (host from pods)
      - ip: 172.18.0.1
    ports:
      - name: http
        port: 4747
        protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gitnexus
  namespace: infra
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: Host(`gitnexus.asrax.in`)
      kind: Rule
      priority: 8000
      middlewares:
        - name: force-https
        - name: force-https-proto
        - name: global-cors
      services:
        - name: gitnexus
          port: 4747
