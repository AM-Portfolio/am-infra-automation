name: Nonprod origin (VPS vs laptop)

# Back-compat wrapper: preprod plane only (Workers KV + *-preprod backends).
# Prefer Nonprod fleet origin for plane=dev|preprod.
# See am-gitops/docs/NONPROD_DUAL.md. Break-glass: scripts/kind-fleet/nonprod-origin.sh
# or nonprod-fleet-origin.sh preprod …
#
# GitHub Environments: nonprod-vps | nonprod-local
# Secrets: CLOUDFLARE_API_TOKEN (required); optional CF_ACCOUNT_ID / CF_KV_NAMESPACE_ID

on:
  workflow_dispatch:
    inputs:
      origin:
        description: Nonprod edge origin (vps = Contabo preprod, local = laptop nonprod-dr)
        required: true
        type: choice
        options:
          - vps
          - local
      dry_run:
        description: Print planned changes only
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  switch:
    runs-on: ubuntu-latest
    environment: ${{ inputs.origin == 'vps' && 'nonprod-vps' || 'nonprod-local' }}
    steps:
      - uses: actions/checkout@v4

      - name: Switch preprod origin (fleet script plane=preprod)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          ORIGIN: ${{ inputs.origin }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty. Set it on GitHub Environment nonprod-vps / nonprod-local."
            exit 1
          fi
          chmod +x scripts/kind-fleet/nonprod-fleet-origin.sh
          [[ -n "${CF_ACCOUNT_ID:-}" ]] || unset CF_ACCOUNT_ID
          [[ -n "${CF_KV_NAMESPACE_ID:-}" ]] || unset CF_KV_NAMESPACE_ID
          if [[ "${DRY_RUN}" == "true" ]]; then
            ./scripts/kind-fleet/nonprod-fleet-origin.sh preprod "${ORIGIN}" --dry-run
          else
            ./scripts/kind-fleet/nonprod-fleet-origin.sh preprod "${ORIGIN}"
          fi
