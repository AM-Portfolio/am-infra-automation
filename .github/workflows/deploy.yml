name: Deploy AM Infrastructure

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from the UI

jobs:
  deploy-foundation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Setup SSH Authentication
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 150.242.202.122 >> ~/.ssh/known_hosts

      - name: Deploy Foundation (VPS Remote Execution)
        run: npm run foundation:apply
        env:
          # This implicitly uses the orchestrator's 'preprod' default
          # and will execute via SSH onto the VPS disk.
          CI: true
