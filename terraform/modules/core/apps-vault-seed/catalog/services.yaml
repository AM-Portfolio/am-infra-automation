# Vault path leaf names under apps/data/<env>/services/<name>
# Keys = Vault key names (RHS of helm/vault-mappings.yaml). null/empty → fleet placeholder.
# Mirror of am-gitops/<env>/apps (+ side paths: scheduler, logging, am-auth, am-agents, am-oms).
# Keep in sync when adding an Argo Application — do not read am-gitops at apply time.

services:
  am-identity:
    keys:
      KEYCLOAK_ADMIN_USER: "admin"
      KEYCLOAK_ADMIN_PASSWORD: null
      GOOGLE_CLIENT_ID: null
      GOOGLE_CLIENT_SECRET: null
      AM_IDENTITY_CLIENT_ID: "am-identity"
      AM_IDENTITY_CLIENT_SECRET: null
      AUTH_EMAIL_TOKEN_SECRET: null
      AUTH_EMAIL_TOKEN_TTL_SECONDS: "86400"
      SMTP_HOST: "localhost"
      SMTP_PORT: "587"
      SMTP_USER: null
      SMTP_PASSWORD: null
      SMTP_FROM: "noreply@asrax.in"
      SMTP_FROM_DISPLAY_NAME: "AM"
      SMTP_SSL: "false"
      SMTP_STARTTLS: "true"
      PURGE_ENABLED: "false"
      PURGE_PERIOD_DAYS: "30"
      PURGE_PERIOD_MINUTES: "0"
      # QA / agents MCP client_credentials (am-mcp-service)
      AM_MCP_CLIENT_ID: "am-mcp-service"
      AM_MCP_CLIENT_SECRET: null

  am-gateway:
    keys:
      AM_GATEWAY_STREAMING_CLIENT_ID: "am-gateway"
      AM_GATEWAY_STREAMING_CLIENT_SECRET: null

  am-api-gateway:
    keys:
      INTERNAL_GATEWAY_SECRET: null
      ALLOWED_ORIGINS: "*"

  am-asrax-proxy:
    keys:
      INTERNAL_GATEWAY_SECRET: null
      ALLOWED_ORIGINS: "*"

  am-ai-gateway:
    keys:
      LITELLM_MASTER_KEY: null

  am-modern-ui:
    keys: {}

  am-market-data:
    keys:
      # Consumed by am-gateway vault-mappings (MARKET_DATA_URL <- URL)
      URL: "__UI_BASE__/market"
      # OMS / trade CSI maps AM_MARKET_BASE_URL <- url (case-sensitive)
      url: "__UI_BASE__/market"
      AM_MARKET_CLIENT_ID: "am-market-data"
      AM_MARKET_CLIENT_SECRET: null
      UPSTOX_API_KEY: null
      UPSTOX_SECRET_KEY: null
      UPSTOX_REDIRECT_URI: "__UI_BASE__/market/callback"
      UPSTOCK_ACCESS_TOKEN: null
      api_host: "https://cdn.growthbook.io"
      client_key: null
      redis_cache_ttl_analysis: "300"
      redis_cache_ttl_historical: "3600"
      redis_cache_ttl_intraday_buffer: "60"
      redis_cache_ttl_intraday_future: "60"
      redis_cache_ttl_intraday_past: "60"
      redis_cleanup_batch_size: "1000"
      redis_cleanup_retention_days: "7"
      scheduler_timezone: "Asia/Kolkata"
      scheduler_cookie_enabled: "false"
      scheduler_cookie_refresh_cron: "0 */6 * * *"
      scheduler_stock_indices_enabled: "false"
      scheduler_stock_indices_morning_fetch_cron: "0 9 * * 1-5"
      scheduler_stock_indices_evening_fetch_cron: "0 16 * * 1-5"
      scheduler_stock_indices_retry_cron: "*/15 * * * *"
      scheduler_stock_indices_retry_interval_minutes: "15"
      scheduler_stock_indices_retry_max_retries: "3"
      scheduler_indices_fetch_cron: "0 9 * * 1-5"
      scheduler_ingestion_enabled: "false"
      scheduler_ingestion_provider: "upstox"
      scheduler_ingestion_force: "false"
      scheduler_ingestion_use_websocket: "false"
      scheduler_ingestion_poll_enabled: "false"
      scheduler_ingestion_poll_historical: "false"
      scheduler_ingestion_start_cron: "0 9 * * 1-5"
      scheduler_ingestion_stop_cron: "0 16 * * 1-5"
      scheduler_ingestion_symbols: "RELIANCE"
      scheduler_historical_sync_cron: "0 2 * * *"
      scheduler_analysis_daily_cron: "0 18 * * 1-5"
      scheduler_redis_cleanup_cron: "0 3 * * *"
      scheduler_redis_cleanup_enabled: "false"
      scheduler_stream_start_cron: "0 9 * * 1-5"
      scheduler_stream_stop_cron: "0 16 * * 1-5"
      scheduler_market_start: "09:15"
      scheduler_market_end: "15:30"

  am-market-data-scheduler:
    # Same scheduler keys as am-market-data — market-data SPC mounts this path.
    keys:
      redis_cache_ttl_analysis: "300"
      redis_cache_ttl_historical: "3600"
      redis_cache_ttl_intraday_buffer: "60"
      redis_cache_ttl_intraday_future: "60"
      redis_cache_ttl_intraday_past: "60"
      redis_cleanup_batch_size: "1000"
      redis_cleanup_retention_days: "7"
      scheduler_timezone: "Asia/Kolkata"
      scheduler_cookie_enabled: "false"
      scheduler_cookie_refresh_cron: "0 */6 * * *"
      scheduler_stock_indices_enabled: "false"
      scheduler_stock_indices_morning_fetch_cron: "0 9 * * 1-5"
      scheduler_stock_indices_evening_fetch_cron: "0 16 * * 1-5"
      scheduler_stock_indices_retry_cron: "*/15 * * * *"
      scheduler_stock_indices_retry_interval_minutes: "15"
      scheduler_stock_indices_retry_max_retries: "3"
      scheduler_indices_fetch_cron: "0 9 * * 1-5"
      scheduler_ingestion_enabled: "false"
      scheduler_ingestion_provider: "upstox"
      scheduler_ingestion_force: "false"
      scheduler_ingestion_use_websocket: "false"
      scheduler_ingestion_poll_enabled: "false"
      scheduler_ingestion_poll_historical: "false"
      scheduler_ingestion_start_cron: "0 9 * * 1-5"
      scheduler_ingestion_stop_cron: "0 16 * * 1-5"
      scheduler_ingestion_symbols: "RELIANCE"
      scheduler_historical_sync_cron: "0 2 * * *"
      scheduler_analysis_daily_cron: "0 18 * * 1-5"
      scheduler_redis_cleanup_cron: "0 3 * * *"
      scheduler_redis_cleanup_enabled: "false"
