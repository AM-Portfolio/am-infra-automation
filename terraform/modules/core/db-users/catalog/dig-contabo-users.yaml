# Mirror dig Contabo dig-scoped principals (apps-vault-seed *_dev) onto Contabo stores.
# Applied via kubectl Jobs from laptop (prod stores TF runs on Contabo VPS).
# Passwords: sha256("engine|logical|dev|<seed>")[0:32] — seed from DIG_PRINCIPAL_SEED env (not Contabo admin).

version: 1
env_suffix: _dev

# Must stay aligned with terraform/modules/core/apps-vault-seed/locals.tf dig names.
postgresql:
  - name: am_user_platform_user_dev
    logical: user_platform
    database: user_platform_dev
    createdb: true
  - name: am_subscription_user_dev
    logical: am_subscription
    database: am_subscription_dev
    createdb: true

