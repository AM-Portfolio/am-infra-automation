# Dev and preprod Kafka on the prod infra cluster, beside the existing prod broker.
# Prod stays kafka / nodePort 30092 / kafka.asrax.in:9092.
# Dev:  kafka-dev     nodePort 30094  public kafka-dev.asrax.in:9094
# Preprod: kafka-preprod nodePort 30095  public kafka-preprod.asrax.in:9095
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kafka-dev-pv
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual-hostpath
  hostPath:
    path: /var/am-infra/data/kafka-dev
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-dev-pvc
  namespace: infra
  
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: manual-hostpath
  volumeName: kafka-dev-pv
  resources:


    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-dev
  namespace: infra
spec:
  clusterIP: None
  selector:
    app: kafka-dev
  ports:
    - name: tcp-internal
      port: 9092
      targetPort: 9092
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-dev-external
  namespace: infra
spec:
  type: NodePort
  selector:
    app: kafka-dev
  ports:
    - name: tcp-external
      port: 29092
      targetPort: 29092
      nodePort: 30094
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-dev
  namespace: infra
  labels:
    app: kafka-dev
spec:
  serviceName: kafka-dev
  replicas: 1
  selector:
    matchLabels:
      app: kafka-dev
  template:
    metadata:
      labels:
        app: kafka-dev
    spec:
      nodeSelector:
        kubernetes.io/hostname: am-prod-infra-control-plane
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: fix-permissions
          image: busybox
          command: ["sh", "-c", "chown -R 1000:1000 /var/lib/kafka/data"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.6.0
          ports:
            - containerPort: 9092
            - containerPort: 29092
            - containerPort: 9093
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: INTERNAL://kafka-dev:9092,EXTERNAL://kafka-dev.asrax.in:9094
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: INTERNAL
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: CLUSTER_ID
              value: "uPyFZ_O8RsOLUbapx6dXpg"
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data/kraft-combined-logs
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kafka-dev-pvc
---
