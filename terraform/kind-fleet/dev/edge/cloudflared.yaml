# Laptop HTTPS edge. Token is a cluster secret, never git.
# kubectl -n infra create secret generic cloudflare-tunnel --from-file=token=...
# Tunnel: asrax-dev-tunnel. Origin is Traefik only (http://traefik.infra.svc:80).
# Prefer terraform/kind-fleet/dev/edge (modules/core/edge). This YAML is the fallback spec.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: infra
  labels:
    app: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2025.4.0
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-tunnel
                  key: token
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10
