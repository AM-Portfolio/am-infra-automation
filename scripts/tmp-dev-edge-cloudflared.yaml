apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: infra
  labels:
    app: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2025.4.0
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-tunnel
                  key: token
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: force-https-proto
  namespace: infra
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: https
---
# App ingresses reference am-apps-dev-dev-global-cors@kubernetescrd
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: dev-global-cors
  namespace: am-apps-dev
spec:
  headers:
    accessControlAllowMethods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
      - PATCH
    accessControlAllowHeaders:
      - "*"
    accessControlAllowOriginList:
      - "*"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: dev-global-cors
  namespace: am-agents-dev
spec:
  headers:
    accessControlAllowMethods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
      - PATCH
    accessControlAllowHeaders:
      - "*"
    accessControlAllowOriginList:
      - "*"
---
# Public dig Argo for GitHub Approve (HTTPS via Cloudflare → Traefik → Argo HTTP)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: argocd-dev.asrax.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
