# AM obs hub — VPS2 (4c/8GB/200GB). No Kind. No external DB.
# Docs: docs/kind-fleet-clusters/OBS_DEPLOY.md
# Data bind-mounts expect host paths under /data/am-state/obs/

name: am-obs

networks:
  am-obs:
    name: am-obs
    driver: bridge

services:
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.25"
    networks: [am-obs]
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    # Tunnel origin only — do not publish 80/443 on public NIC in production.
    # cloudflared connects over Docker DNS to traefik:80
    expose:
      - "80"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    mem_limit: 128m
    cpus: "0.15"
    networks: [am-obs]
    env_file:
      - /data/am-state/obs/secrets/cloudflared.env
    command: tunnel --no-autoupdate run
    depends_on: [traefik]

  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    mem_limit: 2g
    cpus: "1.2"
    networks: [am-obs]
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - /data/am-state/obs/loki:/loki
    expose:
      - "3100"
    user: "0:0"

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    mem_limit: 1280m
    cpus: "0.75"
    networks: [am-obs]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /data/am-state/obs/prometheus:/prometheus
    expose:
      - "9090"
    user: "0:0"

  tempo:
    image: grafana/tempo:2.7.1
    restart: unless-stopped
    mem_limit: 1536m
    cpus: "0.75"
    networks: [am-obs]
    command: -config.file=/etc/tempo/tempo-config.yml
    volumes:
      - ./tempo/tempo-config.yml:/etc/tempo/tempo-config.yml:ro
      - /data/am-state/obs/tempo:/var/tempo
    expose:
      - "3200"
      - "4317"
      - "4318"
    user: "0:0"

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    mem_limit: 1g
    cpus: "0.5"
    networks: [am-obs]
    environment:
      GF_SERVER_ROOT_URL: https://grafana.asrax.in
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DATABASE_TYPE: sqlite3
      GF_DATABASE_PATH: /var/lib/grafana/grafana.db
      GF_PATHS_DATA: /var/lib/grafana
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
    env_file:
      - path: /data/am-state/obs/secrets/grafana.env
        required: false
    volumes:
      - /data/am-state/obs/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    expose:
      - "3000"
    depends_on: [loki, prometheus, tempo]
    user: "0:0"

  log-janitor:
    image: alpine:3.21
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.2"
    networks: [am-obs]
    volumes:
      - /data/am-state/obs/loki:/loki
      - ./janitor/janitor.sh:/janitor.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache findutils coreutils >/dev/null
        while true; do
          /bin/sh /janitor.sh || true
          sleep 21600
        done

  # Phase 6 — hub self-telemetry (Docker logs → local Loki; labels environment=obs).
  alloy:
    image: grafana/alloy:v1.7.1
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.25"
    networks: [am-obs]
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /data/am-state/obs/alloy:/var/lib/alloy/data
    depends_on: [loki]
    user: "0:0"
    expose:
      - "12345"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    mem_limit: 192m
    cpus: "0.2"
    networks: [am-obs]
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
    expose:
      - "8080"

  # Host disk/CPU for Platform Overview Storage glance (vps-obs).
  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    mem_limit: 96m
    cpus: "0.1"
    networks: [am-obs]
    pid: host
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /:/host:ro,rslave
    expose:
      - "9100"

  # Static am_vps_info series for Platform inventory / filters (fleet SoT).
  am-vps-info:
    image: python:3.12-alpine
    restart: unless-stopped
    mem_limit: 64m
    cpus: "0.05"
    networks: [am-obs]
    working_dir: /srv
    command: ["python", "/srv/serve.py"]
    volumes:
      - ./prometheus/am_vps_info:/srv:ro
    expose:
      - "9100"
