# Minimal scrape â€” remote_write receiver is the primary ingest path for fleet Alloy.
# Local scrapes cover the nonprod Grafana hub itself (environment=nonprod).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          vps: vps-nonprod
          vps_name: VPS_NONPROD
          vps_ip: "129.121.132.116"
          environment: nonprod
          cluster: am-obs-hub

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          vps: vps-nonprod
          vps_name: VPS_NONPROD
          vps_ip: "129.121.132.116"
          environment: nonprod
          cluster: am-obs-hub

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
        labels:
          vps: vps-nonprod
          vps_name: VPS_NONPROD
          vps_ip: "129.121.132.116"
          environment: nonprod
          cluster: am-obs-hub

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
        labels:
          vps: vps-nonprod
          vps_name: VPS_NONPROD
          vps_ip: "129.121.132.116"
          environment: nonprod
          cluster: am-obs-hub

  - job_name: traefik
    static_configs:
      - targets: ["traefik:8080"]
        labels:
          vps: vps-nonprod
          vps_name: VPS_NONPROD
          vps_ip: "129.121.132.116"
          environment: nonprod
          cluster: am-obs-hub

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          vps: vps-nonprod
          vps_name: VPS_NONPROD
          vps_ip: "129.121.132.116"
          environment: nonprod
          cluster: am-obs-hub

  # Fleet inventory SoT (matches am-obs-platform compiler/catalog/fleet-inventory.yaml).
  # Serves static am_vps_info for Platform / Infra Overview inventory table.
  # Do NOT stamp environment/cluster here â€” the metric already carries per-VPS labels;
  # scrape labels would overwrite them and force every row to obs (exported_* rename).
  - job_name: am-vps-info
    metrics_path: /metrics
    static_configs:
      - targets: ["am-vps-info:9100"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          vps: vps-nonprod
          vps_name: VPS_NONPROD
          vps_ip: "129.121.132.116"
          environment: nonprod
          cluster: am-obs-hub
          instance: vps-nonprod

  # Prod public edge â€” synthetic reachability (502 / connect-fail).
  - job_name: blackbox-prod-edge
    metrics_path: /probe
    params:
      module: [http_edge]
    static_configs:
      - targets:
          - https://am.asrax.in/
          - https://am.asrax.in/gateway
          - https://auth.asrax.in/realms/am-realm
        labels:
          environment: prod
          probe_set: prod-edge
          vps: vps-nonprod
          cluster: am-obs-hub
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # Prod apps + agents — per-service probes (405 / 502 / down → Cliq).
  - job_name: blackbox-prod-services
    metrics_path: /probe
    params:
      module: [http_edge]
    static_configs:
      - targets: ["https://am.asrax.in/"]
        labels: { environment: prod, namespace: am-apps-prod, service: am-modern-ui, probe_set: prod-apps }
      - targets: ["https://am.asrax.in/identity"]
        labels: { environment: prod, namespace: am-apps-prod, service: am-identity, probe_set: prod-apps }
      - targets: ["https://am.asrax.in/am"]
        labels: { environment: prod, namespace: am-apps-prod, service: am-asrax-proxy, probe_set: prod-apps }
      - targets: ["https://am.asrax.in/gateway"]
        labels: { environment: prod, namespace: am-apps-prod, service: am-gateway, probe_set: prod-apps }
      - targets: ["https://am.asrax.in/market"]
        labels: { environment: prod, namespace: am-apps-prod, service: am-market-data, probe_set: prod-apps }
      - targets: ["https://am.asrax.in/portfolio"]
        labels: { environment: prod, namespace: am-apps-prod, service: am-portfolio, probe_set: prod-apps }
      - targets: ["https://am.asrax.in/trade"]
        labels: { environment: prod, namespace: am-apps-prod, service: am-trade-management, probe_set: prod-apps }
      - targets: ["https://am.asrax.in/notifications"]
        labels: { environment: prod, namespace: am-apps-prod, service: am-notification, probe_set: prod-apps }
      - targets: ["https://am.asrax.in/subscriptions"]
        labels: { environment: prod, namespace: am-apps-prod, service: am-subscription, probe_set: prod-apps }
      - targets: ["https://corp.asrax.in/"]
        labels: { environment: prod, namespace: am-apps-prod, service: am-asrax-corp, probe_set: prod-apps }
      - targets: ["https://auth.asrax.in/realms/am-realm"]
        labels: { environment: prod, namespace: am-apps-prod, service: keycloak-am-realm, probe_set: prod-apps }
      - targets: ["https://am.asrax.in/ai"]
        labels: { environment: prod, namespace: am-agents-prod, service: am-ai-gateway, probe_set: prod-agents }
      - targets: ["https://am.asrax.in/qa"]
        labels: { environment: prod, namespace: am-agents-prod, service: am-qa-agents, probe_set: prod-agents }
      - targets: ["https://am.asrax.in/support"]
        labels: { environment: prod, namespace: am-agents-prod, service: am-support-agent, probe_set: prod-agents }
      - targets: ["https://am.asrax.in/mcp"]
        labels: { environment: prod, namespace: am-agents-prod, service: am-mcp-server, probe_set: prod-agents }
      - targets: ["https://am.asrax.in/db"]
        labels: { environment: prod, namespace: am-agents-prod, service: am-db-agent, probe_set: prod-agents }
      - targets: ["https://am.asrax.in/mkt-portal"]
        labels: { environment: prod, namespace: am-agents-prod, service: am-mkt-portal-ui, probe_set: prod-agents }
      - targets: ["https://asrax.in/"]
        labels: { environment: prod, namespace: am-agents-prod, service: am-asrax-ui, probe_set: prod-agents }
      - targets: ["https://ai.asrax.in/"]
        labels: { environment: prod, namespace: am-agents-prod, service: am-qa-portal-ui, probe_set: prod-agents }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: blackbox-exporter
    static_configs:
      - targets: ["blackbox:9115"]
        labels:
          vps: vps-nonprod
          vps_name: VPS_NONPROD
          vps_ip: "129.121.132.116"
          environment: nonprod
          cluster: am-obs-hub
