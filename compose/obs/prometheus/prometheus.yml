# Minimal scrape — remote_write receiver is the primary ingest path for fleet Alloy.
# Local scrapes cover the obs hub itself (environment=obs).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          vps: vps-obs
          vps_name: VPS_OBS
          vps_ip: "129.121.132.116"
          environment: obs
          cluster: am-obs

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          vps: vps-obs
          vps_name: VPS_OBS
          vps_ip: "129.121.132.116"
          environment: obs
          cluster: am-obs

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
        labels:
          vps: vps-obs
          vps_name: VPS_OBS
          vps_ip: "129.121.132.116"
          environment: obs
          cluster: am-obs

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
        labels:
          vps: vps-obs
          vps_name: VPS_OBS
          vps_ip: "129.121.132.116"
          environment: obs
          cluster: am-obs

  - job_name: traefik
    static_configs:
      - targets: ["traefik:8080"]
        labels:
          vps: vps-obs
          vps_name: VPS_OBS
          vps_ip: "129.121.132.116"
          environment: obs
          cluster: am-obs

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          vps: vps-obs
          vps_name: VPS_OBS
          vps_ip: "129.121.132.116"
          environment: obs
          cluster: am-obs

  # Fleet inventory SoT (matches am-obs-platform compiler/catalog/fleet-inventory.yaml).
  # Serves static am_vps_info for Platform / Infra Overview inventory table.
  # Do NOT stamp environment/cluster here — the metric already carries per-VPS labels;
  # scrape labels would overwrite them and force every row to obs (exported_* rename).
  - job_name: am-vps-info
    metrics_path: /metrics
    static_configs:
      - targets: ["am-vps-info:9100"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          vps: vps-obs
          vps_name: VPS_OBS
          vps_ip: "129.121.132.116"
          environment: obs
          cluster: am-obs
          instance: vps-obs
