apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: preprod-apps-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/AM-Portfolio/am-infra-automation.git'
    targetRevision: main
    path: gitops/preprod
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
