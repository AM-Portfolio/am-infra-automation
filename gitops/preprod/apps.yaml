            valueFiles:
              - '$values-source/apps/am-doc-viewer-ui/helm/values.yaml'
              - '$values-source/apps/am-doc-viewer-ui/helm/values.preprod.yaml'
        - repoURL: 'https://github.com/AM-Portfolio/am-doc-intelligence.git'
          targetRevision: feature/isolated-runners
