apiVersion: v1
kind: List
items:
  # 1. Cloudinary Manager
  - apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: am-cloudinary-manager-preprod
      namespace: argocd
    spec:
      project: default
      sources:
        - repoURL: 'https://github.com/AM-Portfolio/am-pipelines.git'
          targetRevision: feature/parameterizable-runners
          path: helm/universal-chart
          helm:
            valueFiles:
              - '$values-source/services/am-cloudinary-manager/helm/values.yaml'
              - '$values-source/services/am-cloudinary-manager/helm/vault-mappings.yaml'
              - '$values-source/services/am-cloudinary-manager/helm/values.preprod.yaml'
        - repoURL: 'https://github.com/AM-Portfolio/am-doc-intelligence.git'
          targetRevision: feature/isolated-runners
          ref: values-source
      destination:
        server: 'https://kubernetes.default.svc'
        namespace: am-apps-preprod
      syncPolicy:
        automated:
          prune: true
          selfHeal: true

  # 2. Document Processor
  - apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: am-document-processor-preprod
      namespace: argocd
    spec:
      project: default
      sources:
        - repoURL: 'https://github.com/AM-Portfolio/am-pipelines.git'
          targetRevision: feature/parameterizable-runners
          path: helm/universal-chart
          helm:
            valueFiles:
              - '$values-source/services/am-document-processor/helm/values.yaml'
              - '$values-source/services/am-document-processor/helm/vault-mappings.yaml'
              - '$values-source/services/am-document-processor/helm/values.preprod.yaml'
        - repoURL: 'https://github.com/AM-Portfolio/am-doc-intelligence.git'
          targetRevision: feature/isolated-runners
          ref: values-source
      destination:
        server: 'https://kubernetes.default.svc'
        namespace: am-apps-preprod
      syncPolicy:
        automated:
          prune: true
          selfHeal: true

